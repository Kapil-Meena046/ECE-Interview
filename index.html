<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef">
<title>Sunny — ECE Interview Practice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--paper:#f5f4ef;--white:#fffefa;--ink:#202521;--muted:#777b73;--line:#e7e5dc;--green:#365a49;--green2:#e4eee7;--orange:#dc764a;--orange2:#f9e9df;--yellow:#f1c65b;--blue:#dfe9f2;--radius:14px;--shadow:0 10px 30px #22220f0b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{min-height:100vh}.shell{max-width:1320px;margin:0 auto;padding:0 42px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f5f4efed;backdrop-filter:blur(10px);z-index:4}.brand{display:flex;align-items:center;gap:11px;font:800 17px Manrope,sans-serif;letter-spacing:-.6px}.brand-mark{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block}.brand em{font-style:normal;color:var(--green)}.top-right{display:flex;align-items:center;gap:20px}.date{font:11px 'DM Mono';color:var(--muted);letter-spacing:.6px}.avatar{width:34px;height:34px;border-radius:50%;background:#ecdcc9;display:grid;place-items:center;color:#694630;font:700 11px Manrope}.content{padding:43px 0 80px}.eyebrow{font:11px 'DM Mono';letter-spacing:1.6px;text-transform:uppercase;color:var(--green)}h1,h2,h3,p{margin-top:0}h1{font:600 clamp(30px,4vw,48px)/1.12 Manrope,sans-serif;letter-spacing:-2px;margin:13px 0 12px}.intro{color:var(--muted);font-size:15px;margin:0;line-height:1.65}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:31px;gap:24px}.primary{border:0;background:var(--green);color:white;padding:13px 18px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 3px 10px #365a4922;transition:.2s}.primary:hover{background:#294b3a;transform:translateY(-1px)}.icon{font-size:18px;line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 38px}.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:19px 21px;display:flex;align-items:center;gap:14px}.stat-icon{width:38px;height:38px;border-radius:10px;background:var(--green2);display:grid;place-items:center;font-size:16px}.stat:nth-child(2) .stat-icon{background:var(--orange2)}.stat:nth-child(3) .stat-icon{background:#f7efda}.stat-number{font:700 23px Manrope;letter-spacing:-1px}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-head h2{font:700 16px Manrope;margin:0;letter-spacing:-.3px}.section-head span{font:11px 'DM Mono';color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.topic{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px 21px 17px;transition:.2s;cursor:pointer;position:relative;overflow:hidden;min-height:170px}.topic:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d1d9d0}.topic-top{display:flex;justify-content:space-between;align-items:flex-start}.topic-icon{width:42px;height:42px;border-radius:11px;background:var(--green2);display:grid;place-items:center;font-size:20px}.topic:nth-child(3n+2) .topic-icon{background:var(--orange2)}.topic:nth-child(3n) .topic-icon{background:var(--blue)}.arrow{color:#a8aaa1;font-size:17px}.topic h3{font:700 15px Manrope;margin:17px 0 5px;letter-spacing:-.3px}.topic-meta{font-size:12px;color:var(--muted)}.topic-bottom{display:flex;align-items:center;gap:10px;margin-top:16px}.progress{height:4px;background:#eeede6;border-radius:10px;flex:1;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:10px}.percent{font:10px 'DM Mono';color:#81847b}.add-topic{background:transparent;border:1px dashed #cbc9bf;border-radius:var(--radius);min-height:170px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.2s}.add-topic:hover{border-color:var(--green);color:var(--green);background:#f8faf7}.add-circle{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:300}.add-topic span:last-child{font-size:12px;font-weight:600}.footer-note{margin-top:35px;padding:17px 20px;border-radius:11px;background:#ecebe3;display:flex;gap:12px;align-items:flex-start;color:#65685f;font-size:12px;line-height:1.6}.footer-note b{color:#343a33}.practice-top{display:flex;align-items:center;justify-content:space-between;padding-top:32px;margin-bottom:37px}.back{border:0;background:none;color:var(--muted);font-size:13px;padding:7px 0;display:flex;align-items:center;gap:8px}.back:hover{color:var(--ink)}.topic-title{display:flex;gap:14px;align-items:center}.topic-title .topic-icon{width:48px;height:48px}.topic-title h1{font-size:28px;margin:0;letter-spacing:-1px}.topic-title p{font-size:12px;color:var(--muted);margin:4px 0 0}.practice-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}.question-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:30px 34px;min-height:380px;box-shadow:var(--shadow)}.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.q-count{font:11px 'DM Mono';color:var(--muted)}.tag{padding:5px 9px;border-radius:20px;background:var(--green2);color:var(--green);font:10px 'DM Mono';letter-spacing:.3px}.question{font:600 clamp(20px,2.6vw,27px)/1.4 Manrope;letter-spacing:-.7px;max-width:750px;margin-bottom:27px}.answer-label{font:10px 'DM Mono';letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.answer{font-size:14px;line-height:1.8;color:#555a53;padding:16px 18px;border-left:2px solid #d8d6cd;background:#f7f6f1;border-radius:0 9px 9px 0;white-space:pre-wrap}.answer.hidden{filter:blur(5px);user-select:none;color:#a9aaa2;min-height:60px}.card-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.secondary,.rating-btn{border:1px solid var(--line);background:var(--white);color:#4b514a;padding:10px 13px;border-radius:8px;font-size:12px;font-weight:600;transition:.15s}.secondary:hover,.rating-btn:hover{border-color:#b8c8bb;color:var(--green)}.secondary.primary-lite{background:var(--green2);border-color:var(--green2);color:var(--green)}.side-panel{display:flex;flex-direction:column;gap:13px}.side-box{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:19px}.side-box h3{font:700 12px Manrope;margin:0 0 14px}.progress-big{font:700 28px Manrope;letter-spacing:-1px}.progress-caption{font-size:11px;color:var(--muted);margin-top:2px}.side-progress{height:5px;background:#eeede6;border-radius:5px;margin-top:13px}.side-progress i{display:block;height:100%;background:var(--green);border-radius:5px}.rating-list{display:flex;flex-direction:column;gap:7px}.rating-btn{padding:9px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;font-weight:500}.rating-btn.active{border-color:#8ca894;background:#edf4ee;color:var(--green)}.rating-btn small{font-size:10px;color:#8b8d85}.side-tip{background:#f4eddc;border:0;color:#665938;font-size:11px;line-height:1.6}.side-tip strong{display:block;margin-bottom:4px;color:#514628}.list-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}.list-head h2{font:700 14px Manrope;margin:0}.add-small{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:700;padding:6px}.question-list{border:1px solid var(--line);border-radius:12px;background:var(--white);overflow:hidden}.question-row{padding:15px 18px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);cursor:pointer}.question-row:last-child{border-bottom:0}.question-row:hover{background:#faf9f5}.q-dot{width:8px;height:8px;border-radius:50%;background:#d5d4ca;flex:none}.q-dot.good{background:#5b9c70}.q-dot.again{background:var(--orange)}.row-text{font-size:12px;flex:1;line-height:1.5}.row-tag{font:9px 'DM Mono';color:#8a8c84}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#1c231dd0;z-index:10;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}.modal{width:min(520px,100%);border-radius:15px;background:var(--white);padding:26px;box-shadow:0 20px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font:700 19px Manrope;margin:0}.close{background:none;border:0;color:#85877f;font-size:22px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font:10px 'DM Mono';text-transform:uppercase;letter-spacing:1px;color:#686d65}.field input,.field textarea,.field select{width:100%;border:1px solid #dfded5;border-radius:8px;background:#fff;padding:11px 12px;font-size:13px;outline:0;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus{border-color:#77927f;box-shadow:0 0 0 3px #365a4912}.field textarea{resize:vertical;min-height:100px;line-height:1.55}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.cancel{border:0;background:none;color:var(--muted);padding:10px 13px;font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#26372c;color:#fff;padding:11px 17px;border-radius:9px;font-size:12px;opacity:0;transition:.25s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.shell{padding:0 23px}.cards{grid-template-columns:repeat(2,1fr)}.practice-layout{grid-template-columns:1fr}.side-panel{display:grid;grid-template-columns:repeat(2,1fr)}.side-tip{grid-column:1/-1}.question-card{padding:25px}.practice-top{align-items:flex-start;gap:15px;flex-direction:column}.topbar{height:66px}.date{display:none}}
@media(max-width:540px){.shell{padding:0 17px}.content{padding-top:31px}.hero-row{align-items:flex-start;flex-direction:column}.hero-row .primary{width:100%;justify-content:center}.stats{gap:8px}.stat{padding:13px 10px;gap:8px;align-items:flex-start;flex-direction:column}.stat-icon{width:30px;height:30px;font-size:14px}.stat-number{font-size:20px}.stat-label{font-size:10px}.cards{grid-template-columns:1fr}.topic{min-height:155px}.add-topic{min-height:100px}.question-card{padding:21px}.side-panel{grid-template-columns:1fr 1fr}.top-right{gap:10px}}
</style></head>
<body><div id="app"></div><div id="modal-root"></div><div id="toast" class="toast"></div>
<script>
const KEY='benchprep_v1';
const seed=[
{id:'analog',name:'Analog Electronics',icon:'⌁',questions:[{id:'a1',q:'What is the difference between an ideal op-amp and a practical op-amp?',a:'An ideal op-amp has infinite open-loop gain, infinite input impedance, zero output impedance, and unlimited bandwidth. A practical op-amp has very high but finite gain and input impedance, small output impedance, limited bandwidth, and nonzero input offset voltage.',status:''},{id:'a2',q:'Why is negative feedback used in an amplifier?',a:'Negative feedback feeds a portion of the output back in opposition to the input. It stabilizes gain, reduces distortion and noise, increases bandwidth, and makes the gain less sensitive to component variations.',status:''},{id:'a3',q:'What is the function of a diode in a clipper circuit?',a:'A clipper limits a signal’s voltage beyond a chosen level. The diode conducts when the input crosses its threshold, clipping the waveform while leaving the rest largely unchanged.',status:''}]},
{id:'digital',name:'Digital Electronics',icon:'▦',questions:[{id:'d1',q:'What is the difference between a latch and a flip-flop?',a:'A latch is level-triggered: its output can change while the enable level is active. A flip-flop is edge-triggered: it samples its input only on a clock edge. Both store one bit of data.',status:''},{id:'d2',q:'Why do we use a Karnaugh map?',a:'A Karnaugh map provides a visual way to simplify Boolean expressions. Grouping adjacent 1s (or 0s) eliminates changing variables and produces a simpler logic implementation with fewer gates.',status:''},{id:'d3',q:'What is setup time and hold time?',a:'Setup time is how long data must be stable before the active clock edge. Hold time is how long it must remain stable after the edge. Violations can cause metastability.',status:''}]},
{id:'robotics',name:'Robotics',icon:'⌖',questions:[{id:'r1',q:'What is the difference between forward and inverse kinematics?',a:'Forward kinematics calculates a robot end-effector’s position from its joint values. Inverse kinematics finds the joint values needed to reach a desired end-effector position; it can have multiple or no solutions.',status:''},{id:'r2',q:'What does a PID controller do?',a:'A PID controller combines proportional, integral, and derivative terms to reduce error between a target and measured value. P reacts to present error, I accumulates past error, and D responds to the rate of change.',status:''},{id:'r3',q:'Why are encoders used in robotics?',a:'Encoders measure motor or joint position and often speed. This feedback lets a controller close the loop, track motion accurately, and detect movement or positioning errors.',status:''}]},
{id:'embedded',name:'Embedded C',icon:'⌘',questions:[{id:'e1',q:'What does the volatile keyword mean in embedded C?',a:'volatile tells the compiler that a value may change outside the visible program flow, such as through hardware or an interrupt. It prevents caching or removing relevant reads and writes, but does not make operations atomic.',status:''},{id:'e2',q:'Why should an interrupt service routine be short?',a:'A long ISR delays other interrupts and foreground work, increasing latency and risking missed events. The ISR should capture essential data or set a flag, then leave slower processing to the main loop.',status:''},{id:'e3',q:'What is the difference between polling and an interrupt?',a:'Polling repeatedly checks a device status and can waste CPU time. An interrupt lets the device notify the processor when attention is needed, improving responsiveness and freeing the CPU between events.',status:''}]}
];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.topics)?x:{topics:seed,ratings:{},current:{}}}catch{return{topics:seed,ratings:{},current:{}}}}
let db=load(),view='home',activeTopic=null,activeQ=null,shown=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function stats(){let all=db.topics.flatMap(t=>t.questions),mastered=all.filter(q=>db.ratings[q.id]==='good').length;return{all:all.length,mastered,topics:db.topics.length}}
function shell(inner){return `<div class="shell"><header class="topbar"><div class="brand"><img class="brand-mark" src="sunny.jpg" alt="Sunny logo"><span>Sunny</span></div><div class="top-right"><span class="date">ECE · INTERVIEW PREP</span><span class="avatar">KE</span></div></header>${inner}</div>`}
function home(){view='home';const s=stats();document.getElementById('app').innerHTML=shell(`<main class="content"><div class="hero-row"><div><div class="eyebrow">YOUR PERSONAL PRACTICE SPACE</div><h1>Think clearly.<br>Answer confidently.</h1><p class="intro">A little practice today makes a big difference in the room.<br>Keep your important questions close and your understanding sharp.</p></div><button class="primary" onclick="openQuestion()"><span class="icon">＋</span> Add a question</button></div><div class="stats"><div class="stat"><span class="stat-icon">✎</span><div><div class="stat-number">${s.all}</div><div class="stat-label">Questions saved</div></div></div><div class="stat"><span class="stat-icon">↗</span><div><div class="stat-number">${s.mastered}</div><div class="stat-label">Feeling confident</div></div></div><div class="stat"><span class="stat-icon">▤</span><div><div class="stat-number">${s.topics}</div><div class="stat-label">Practice sections</div></div></div></div><div class="section-head"><h2>Your subjects</h2><span>${s.topics} SECTIONS</span></div><div class="cards">${db.topics.map(t=>{let done=t.questions.filter(q=>db.ratings[q.id]==='good').length,pc=t.questions.length?Math.round(done/t.questions.length*100):0;return `<article class="topic" onclick="openTopic('${t.id}')"><div class="topic-top"><span class="topic-icon">${esc(t.icon||'✳')}</span><span class="arrow">↗</span></div><h3>${esc(t.name)}</h3><div class="topic-meta">${t.questions.length} ${t.questions.length===1?'question':'questions'} · ${done} confident</div><div class="topic-bottom"><div class="progress"><i style="width:${pc}%"></i></div><span class="percent">${pc}%</span></div></article>`}).join('')}<button class="add-topic" onclick="openTopicModal()"><span class="add-circle">＋</span><span>Add a subject</span></button></div><div class="footer-note"><span>✦</span><span><b>Practice tip</b> &nbsp;Try answering out loud before you reveal the notes. Explaining an idea in your own words is the best way to find what you really understand.</span></div></main>`)}
function openTopic(id){activeTopic=db.topics.find(t=>t.id===id);if(!activeTopic)return;let remembered=db.current[id],q=activeTopic.questions.find(x=>x.id===remembered)||activeTopic.questions[0];activeQ=q?.id;shown=false;practice()}
function practice(){if(!activeTopic){home();return}const t=activeTopic;let q=t.questions.find(x=>x.id===activeQ)||t.questions[0];if(!q){document.getElementById('app').innerHTML=shell(`<main class="content"><button class="back" onclick="home()">← &nbsp;All subjects</button><div class="practice-top"><div class="topic-title"><span class="topic-icon">${esc(t.icon||'✳')}</span><div><h1>${esc(t.name)}</h1><p>Build understanding, one question at a time.</p></div></div></div><div class="empty">No questions yet. Add the first one to start practicing.</div><button class="primary" onclick="openQuestion()">＋ Add a question</button></main>`);return}
let idx=t.questions.indexOf(q)+1,good=t.questions.filter(x=>db.ratings[x.id]==='good').length,pc=Math.round(good/t.questions.length*100),rating=db.ratings[q.id];document.getElementById('app').innerHTML=shell(`<main class="content"><div class="practice-top"><button class="back" onclick="home()">← &nbsp;All subjects</button><div class="topic-title"><span class="topic-icon">${esc(t.icon||'✳')}</span><div><h1>${esc(t.name)}</h1><p>Build understanding, one question at a time.</p></div></div><button class="primary" onclick="openQuestion()"><span class="icon">＋</span> Add question</button></div><div class="practice-layout"><section><article class="question-card"><div class="q-meta"><span class="q-count">QUESTION ${idx} OF ${t.questions.length}</span><span class="tag">${rating==='good'?'CONFIDENT':rating==='again'?'REVISIT':'PRACTICE'}</span></div><div class="question">${esc(q.q)}</div><div class="answer-label">A way to think about it</div><div class="answer ${shown?'':'hidden'}">${shown?esc(q.a||'Add an answer from the question editor.'):'Try to answer in your own words first. Your saved explanation is just below.'}</div><div class="card-actions"><button class="secondary primary-lite" onclick="toggleAnswer()">${shown?'Hide answer':'◉ &nbsp; Reveal answer'}</button><button class="secondary" onclick="openQuestion('${q.id}')">✎ &nbsp; Edit question</button><button class="secondary" onclick="deleteQuestion('${q.id}')">Delete</button></div></article><div class="list-head"><h2>Questions in this section</h2><button class="add-small" onclick="openQuestion()">＋ Add question</button></div><div class="question-list">${t.questions.map((x,i)=>`<div class="question-row" onclick="selectQ('${x.id}')"><span class="q-dot ${db.ratings[x.id]||''}"></span><span class="row-text">${esc(x.q)}</span><span class="row-tag">${String(i+1).padStart(2,'0')}</span></div>`).join('')}</div></section><aside class="side-panel"><div class="side-box"><h3>Section progress</h3><div class="progress-big">${pc}%</div><div class="progress-caption">${good} of ${t.questions.length} marked confident</div><div class="side-progress"><i style="width:${pc}%"></i></div></div><div class="side-box"><h3>How did that feel?</h3><div class="rating-list"><button class="rating-btn ${rating==='again'?'active':''}" onclick="rate('again')">↻ &nbsp; Need to revisit <small>Still learning</small></button><button class="rating-btn ${rating==='good'?'active':''}" onclick="rate('good')">✓ &nbsp; I understand it <small>Feels solid</small></button></div></div><div class="side-box side-tip"><strong>Make it yours</strong>Answers are starting points. Add an example, sketch, or real project detail to make each explanation your own.</div></aside></div></main>`)}
function selectQ(id){activeQ=id;db.current[activeTopic.id]=id;shown=false;save();practice()}function toggleAnswer(){shown=!shown;practice()}function rate(value){db.ratings[activeQ]=db.ratings[activeQ]===value?'':value;save();practice();toast(value==='good'?'Nice work — marked confident.':'Saved — you can revisit this one.')}
function openQuestion(id){let q=id?activeTopic?.questions.find(x=>x.id===id):null;let opts=db.topics.map(t=>`<option value="${t.id}" ${t===activeTopic?'selected':''}>${esc(t.name)}</option>`).join('');document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${q?'Edit question':'Add a question'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveQuestion(event,'${id||''}')"><div class="field"><label>Subject</label><select name="topic" required>${opts}</select></div><div class="field"><label>Question</label><textarea name="question" placeholder="What do you want to be ready to explain?" required>${esc(q?.q||'')}</textarea></div><div class="field"><label>Your answer / notes</label><textarea name="answer" placeholder="Write a clear explanation in your own words…">${esc(q?.a||'')}</textarea></div><div class="form-actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="primary">Save question</button></div></form></section></div>`}
function saveQuestion(e,id){e.preventDefault();let f=new FormData(e.target),t=db.topics.find(x=>x.id===f.get('topic')),q=t.questions.find(x=>x.id===id);if(q){q.q=f.get('question').trim();q.a=f.get('answer').trim()}else{q={id:'q'+Date.now(),q:f.get('question').trim(),a:f.get('answer').trim(),status:''};t.questions.push(q)}save();closeModal();activeTopic=t;activeQ=q.id;shown=false;practice();toast('Question saved.')}
function openTopicModal(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Add a subject</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveTopic(event)"><div class="field"><label>Subject name</label><input name="name" placeholder="e.g. Signals & Systems" required maxlength="45"></div><div class="field"><label>Choose an icon</label><select name="icon"><option>✳</option><option>⌁</option><option>▦</option><option>⌖</option><option>⌘</option><option>⚙</option><option>◉</option></select></div><div class="form-actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="primary">Create subject</button></div></form></section></div>`}
function saveTopic(e){e.preventDefault();let f=new FormData(e.target),t={id:'t'+Date.now(),name:f.get('name').trim(),icon:f.get('icon'),questions:[]};db.topics.push(t);save();closeModal();home();toast('Subject added.')}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2300)}
function deleteQuestion(id){if(!confirm('Delete this question and its saved progress?'))return;activeTopic.questions=activeTopic.questions.filter(x=>x.id!==id);delete db.ratings[id];if(!activeTopic.questions.length){activeQ=null}else activeQ=activeTopic.questions[0].id;save();shown=false;practice();toast('Question deleted.')}
home();
</script></body></html>
